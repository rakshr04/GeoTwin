services:
  postgres:
    image: postgres:16-alpine
    container_name: geotwin-postgres
    environment:
      POSTGRES_DB: geotwin
      POSTGRES_USER: geotwin
      POSTGRES_PASSWORD: geotwin_local
    ports:
      - "5433:5432"
    volumes:
      - geotwin_pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotwin -d geotwin"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  geotwin_pg:
